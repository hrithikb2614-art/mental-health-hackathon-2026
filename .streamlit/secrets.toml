# Copy this file to .streamlit/secrets.toml (gitignored) and fill in real values
# to enable the AI Assistant and Upload Documents tabs. Without these, those tabs
# show a setup message and the rest of the app works normally.

ANTHROPIC_API_KEY = "xxxx"

# Required to use the Upload Documents tab. Anyone who knows this password can
# add documents to the knowledge base that every visitor's AI Assistant draws
# from, so keep it private.
ADMIN_PASSWORD = "123456"
